[package]
name = "cleanbro-windows"
version = "0.1.0"
edition = "2021"
description = "CleanBro for Windows"
license = "GPL-3.0"

[lib]
name = "cleanbro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.9.0"
