<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanBro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">CleanBro</div>
    <div class="section" data-l="tools"></div>
    <button class="nav" data-tab="cleanup"><i data-icon="sparkles"></i><span data-l="cleanup"></span><em id="badge"></em></button>
    <button class="nav" data-tab="uninstall"><i data-icon="apps"></i><span data-l="uninstall"></span></button>
    <div class="section" data-l="analysis"></div>
    <button class="nav" data-tab="usage"><i data-icon="chart"></i><span data-l="usage"></span></button>
    <button class="nav" data-tab="large"><i data-icon="file"></i><span data-l="large"></span></button>
    <button class="nav" data-tab="stale"><i data-icon="clock"></i><span data-l="stale"></span></button>
    <button class="nav" data-tab="dupes"><i data-icon="copy"></i><span data-l="dupes"></span></button>
    <div class="spacer"></div>
    <div class="disk" id="disk" hidden>
      <div class="disk-row"><b id="disk-name"></b><span id="disk-free"></span></div>
      <div class="track"><div id="disk-bar"></div></div>
      <div class="disk-used" id="disk-used"></div>
    </div>
  </aside>

  <section class="main">
    <div class="titlebar" id="title"></div>
    <div class="hero" id="hero"></div>
    <div class="content" id="content"></div>
    <footer class="footer">
      <div id="foot-left"></div>
      <div id="foot-right"></div>
    </footer>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
