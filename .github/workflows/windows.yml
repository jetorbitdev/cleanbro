# Build CleanBro untuk Windows (Tauri) di setiap perubahan pada windows/.
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: CleanBro (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Rename installer and write checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          $src = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $src ../dist/CleanBro-windows-setup.exe
          $h = (Get-FileHash ../dist/CleanBro-windows-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  CleanBro-windows-setup.exe" | Set-Content -NoNewline ../dist/CleanBro-windows-setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CleanBro-windows-setup
          path: dist/*
          if-no-files-found: error

  release:
    name: Upload to Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CleanBro-windows-setup
          path: dist
      - name: Upload (waits for the macOS workflow to create the release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            sleep 30
          done
          echo "Release $GITHUB_REF_NAME not found." >&2
          exit 1
